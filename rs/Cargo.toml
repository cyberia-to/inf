# inf engine — cargo workspace. cozo/ is the gitignored differential oracle and
# carries its own workspace, so it is excluded here.
[workspace]
resolver = "2"
members = ["value", "ast", "lex", "parse", "source", "plan", "eval", "cli", "lower"]
exclude = ["cozo"]

[workspace.package]
edition = "2021"
license = "Cyber"

[profile.release]
opt-level = 3

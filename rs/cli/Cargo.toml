[package]
name = "inf-cli"
description = "inf — datalog query engine over BBG: the query face of soft3"
version = "0.1.0"
edition.workspace = true
license-file = "LICENSE"

[[bin]]
name = "inf"
path = "src/main.rs"

[dependencies]
inf-value = { version = "0.1", path = "../value" }
inf-ast = { version = "0.1", path = "../ast" }

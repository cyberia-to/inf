[package]
repository = "https://github.com/cyberia-to/inf"
description = "inf data sources"
name = "inf-source"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[lib]
path = "src/lib.rs"

[features]
# `BbgSource` over real committed BBG state (R3b). Pulls bbg → nox → … so this
# feature needs `RUSTC_BOOTSTRAP=1`; the default build stays pure stable Rust.
bbg = ["dep:bbg"]

[dependencies]
inf-value = { version = "0.1.0", path = "../value" }
bbg = { version = "0.1", optional = true }


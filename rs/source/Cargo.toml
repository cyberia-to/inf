[package]
repository = "https://github.com/cyberia-to/inf"
description = "inf data sources"
name = "inf-source"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[lib]
path = "src/lib.rs"

[features]
# Optional committed BBG snapshot adapter. The default query source has no
# storage/VM dependency; select this feature only at the graph host boundary.
bbg = ["dep:bbg"]

[dependencies]
inf-value = { version = "0.1.0", path = "../value" }
bbg = { version = "0.3", path = "../../../bbg/rs", optional = true }
